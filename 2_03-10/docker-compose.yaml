services:
  backend:
    build: 
      context: .
      dockerfile: Dockerfile.backend 
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
      - REQUEST_ORIGIN=http://localhost:5001
    container_name: "backend"
  frontend:
    build: 
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5001:5001"
    container_name: "frontend"
  redis:
    image: redis
    container_name: "redis"
